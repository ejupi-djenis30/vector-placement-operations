      <text x="52" y="24" fill="#17324d" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800">CHECK-IN</text>
      <text x="52" y="42" fill="#66717a" font-family="monospace" font-size="12">FOLLOW-UP RECORDED</text>
    </g>
    <g transform="translate(34 392)">
      <rect width="298" height="56" rx="10" fill="#fffaf2" />
      <circle cx="28" cy="28" r="10" fill="#3b735b" />
      <path d="m23 28 4 4 7-9" fill="none" stroke="#fffaf2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <text x="52" y="24" fill="#17324d" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800">REQUIRED EVIDENCE</text>
      <text x="52" y="42" fill="#66717a" font-family="monospace" font-size="12">SIGNED AND REVIEWED</text>

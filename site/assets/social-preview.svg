      <text x="119" y="27" fill="#bc3c2c" font-family="monospace" font-size="12" font-weight="700">02</text>
      <text x="119" y="50" fill="#17324d" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800">TRACK</text>
      <text x="224" y="27" fill="#fffaf2" font-family="monospace" font-size="12" font-weight="700">03</text>
      <text x="224" y="50" fill="#fffaf2" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800">CLOSE</text>

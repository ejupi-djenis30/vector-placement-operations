      <tspan x="0" y="74" fill="#bc3c2c">School-controlled.</tspan>
    </text>
    <text x="2" y="136" fill="#666c6f" font-family="Arial, Helvetica, sans-serif" font-size="22">Assign, verify and close every record with evidence.</text>
    <g transform="translate(2 181)">
      <circle cx="6" cy="6" r="6" fill="#3b735b" />
      <text x="22" y="12" fill="#17324d" font-family="monospace" font-size="14" font-weight="700" letter-spacing="1.5">SELF-HOSTED · ROLE-SCOPED · AUDITED</text>
    </g>
  </g>

  <g transform="translate(756 72)" filter="url(#shadow)">

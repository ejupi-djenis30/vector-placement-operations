name: Feature request
description: Propose a focused improvement to VECTOR's self-hosted placement workflow.
title: "[Feature] "
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Start with the placement task, not a list of technologies. Use fictional examples only.
        Security reports belong in the
        [security policy](https://github.com/ejupi-djenis30/vector-placement-operations/security/policy).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What search, review, progress, accessibility, or reporting task is hard today?
      placeholder: Describe one concrete use case.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Explain the behavior a user should see.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Main area
      options:
        - Placements, evidence or readiness
        - Students, hosts, cohorts or periods
        - Roles, access scopes or audit
        - Import, export or data portability
        - Branding, accessibility or responsive behavior
        - Deployment, backup or documentation
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Privacy and scope
      description: Explain the records involved, the minimum role that needs access and any privacy or retention impact.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Final checks
      options:
        - label: I searched existing issues and proposals.
          required: true
        - label: I did not include credentials, personal records or private placement data.
          required: true
        - label: I described any new access-control, audit, retention or export requirement.
          required: false

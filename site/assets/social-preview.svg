<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">VECTOR — Self-hosted placement operations for schools</title>
  <desc id="description">A navy and cream preview of VECTOR showing an accountable placement workflow and its readiness checks.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#17324d" stroke-opacity=".07" />
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#10263a" flood-opacity=".2" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#f5efe5" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect x="0" y="0" width="18" height="630" fill="#bc3c2c" />

  <g transform="translate(78 70)">

name: vector-placement-operations

services:
  vector:
    build:
      context: .
    image: vector-placement-operations:local
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      VECTOR_HOST: 0.0.0.0
      VECTOR_PORT: 4173
      VECTOR_DB_PATH: /var/lib/vector/vector.sqlite
    ports:
      - "${VECTOR_BIND_ADDRESS:-127.0.0.1}:${VECTOR_PUBLISHED_PORT:-4173}:4173"
    volumes:
      - vector_data:/var/lib/vector
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const p=process.env.VECTOR_PORT||'4173';fetch('http://127.0.0.1:'+p+'/api/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  vector_data:
